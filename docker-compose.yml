services:
  # API Backend con FastAPI
  fastapi_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_service
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./ingest.py:/app/ingest.py
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - chatbot_network

networks:
  chatbot_network:
    driver: bridge
